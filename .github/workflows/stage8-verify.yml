# Stage 10 checkpoint: signed restore, route/zone contract, privacy audit, UI checks.
name: Stage 6-10 Security Regression

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'api/**'
      - 'test/**'
      - 'aleph.config.json'
      - 'README.md'
      - '.github/workflows/stage8-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Judge A/B, API, decision engine regressions
        run: |
          node --test test/judge-persona-isolation.test.mjs \
            test/notes-ownership.test.mjs \
            test/notes-cookie.test.mjs \
            test/stage8-policy-regression.test.mjs \
            test/stage8-routes.test.mjs \
            test/decider-runtime.test.mjs \
            test/stage6-7-regression.test.mjs
      - name: Stage 9-10 detector, restore identity and backup policy regressions
        run: |
          npm run detect:test
          node --test test/detect-input.test.mjs test/detect-window.test.mjs test/attack-check-readonly.test.mjs test/recovery-api.test.mjs test/post-restore-retest.test.mjs test/stage10-submission-contract.test.mjs test/recovery-observation.test.mjs test/stage10-recovery-ui.test.mjs test/restore-readiness.test.mjs
          node --check public/auth-ui.js
      - name: Existing decision fixtures
        run: |
          npm run decider:test
          npm run fixture:7
      - name: Local production build check
        run: npm run build -- --local
