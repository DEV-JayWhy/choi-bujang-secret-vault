name: Stage 10 Production Recovery Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public recovery authentication boundary and diagnostic headers
        env:
          PUBLIC_URL: https://choi-bujang-secret-vault-xi.vercel.app
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.PUBLIC_URL +
            '/api/restore/11111111-1111-4111-8111-111111111111';
          for (const method of ['GET','POST']) {
            let reply;
            for (let attempt=0; attempt<3; attempt++) {
              reply = await fetch(url, { method, redirect:'manual',
                headers: method==='POST'?{'content-type':'application/json'}:{},
                signal:AbortSignal.timeout(10000) });
              if (reply.status===401) break;
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            const checkpoint=reply.headers.get('x-aleph-recovery-checkpoint');
            const trace=reply.headers.get('x-aleph-recovery-trace');
            const body=await reply.json().catch(()=>null);
            console.log(JSON.stringify({method,status:reply.status,checkpoint,
              tracePresent:Boolean(trace),error:body?.error??null}));
            if (reply.status!==401 || checkpoint!=='auth_missing'
                || !trace || body?.error!=='LOGIN_REQUIRED') {
              throw new Error('PRODUCTION_RECOVERY_DIAGNOSTIC_NOT_ACTIVE');
            }
          }
          NODE

      - name: Verify production deployment identity matches current main
        env:
          PUBLIC_URL: https://choi-bujang-secret-vault-xi.vercel.app
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          let latest=null;
          for(let attempt=0;attempt<12;attempt++){
            try{
              const r=await fetch(process.env.PUBLIC_URL+'/aleph.json',{
                cache:'no-store',redirect:'manual',signal:AbortSignal.timeout(8000)});
              if(r.status===200){
                const identity=await r.json();
                latest={status:r.status,commit:identity.commit,
                  app:identity.publicAppUrl,step:identity.step};
                if(identity.commit===process.env.EXPECTED_SHA
                  && identity.step>=10
                  && identity.publicAppUrl===process.env.PUBLIC_URL){
                  console.log('PRODUCTION_CURRENT_SHA_READY',
                    JSON.stringify({step:identity.step,shaMatches:true,urlMatches:true}));
                  process.exit(0);
                }
              }else latest={status:r.status};
            }catch{latest={status:'transport_failed'};}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          console.log('DEPLOYMENT_IDENTITY_NOT_YET_CURRENT',JSON.stringify(latest));
          process.exit(1);
          NODE

      - name: Check official judge JWKS reachability for real ES256 verification
        run: |
          node --input-type=module <<'NODE'
          const endpoint='https://aleph-judge-production.up.railway.app/defense/judge/.well-known/jwks.json';
          const response=await fetch(endpoint,{redirect:'error',signal:AbortSignal.timeout(12000)});
          const json=await response.json().catch(()=>null);
          const keys=Array.isArray(json?.keys)?json.keys:[];
          const es256=keys.some(key=>key.kty==='EC'&&key.crv==='P-256'&&key.x&&key.y);
          console.log(JSON.stringify({jwksStatus:response.status,keyCount:keys.length,hasES256:es256}));
          if(response.status!==200||!es256) throw new Error('JUDGE_JWKS_UNAVAILABLE');
          NODE

      - name: Verify real judge-shaped but unsigned-by-judge token is rejected
        env:
          PUBLIC_URL: https://choi-bujang-secret-vault-xi.vercel.app
        run: |
          node --input-type=module <<'NODE'
          import {generateKeyPairSync, randomUUID, sign} from 'node:crypto';
          const {privateKey}=generateKeyPairSync('ec',{namedCurve:'prime256v1'});
          const b64=x=>Buffer.from(JSON.stringify(x)).toString('base64url');
          const now=Math.floor(Date.now()/1000);
          const header=b64({alg:'ES256',typ:'JWT'});
          const payload=b64({iss:'https://aleph-judge-production.up.railway.app/defense/judge',
            aud:new URL(process.env.PUBLIC_URL).hostname,sub:randomUUID(),
            aleph_run:randomUUID(),aleph_role:'judge',aleph_identity:'b',
            iat:now,exp:now+300});
          const data=header+'.'+payload;
          const sig=sign('sha256',Buffer.from(data),{
            key:privateKey,dsaEncoding:'ieee-p1363'}).toString('base64url');
          const url=process.env.PUBLIC_URL+'/api/restore/11111111-1111-4111-8111-111111111111';
          const res=await fetch(url,{headers:{authorization:'Bearer '+data+'.'+sig},
            redirect:'error',signal:AbortSignal.timeout(12000)});
          const body=await res.json().catch(()=>null);
          const gate=res.headers.get('x-aleph-recovery-checkpoint');
          console.log(JSON.stringify({status:res.status,checkpoint:gate,error:body?.error}));
          if(res.status!==401||gate!=='auth_rejected'||body?.error!=='LOGIN_REQUIRED')
            throw new Error('UNTRUSTED_JUDGE_SIGNATURE_NOT_REJECTED');
          NODE
