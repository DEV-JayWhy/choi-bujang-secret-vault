name: ALEPH Defense Bundle

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Submission baseline: optional full SHA; blank uses workflow commit (changedFiles is this commit only)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select and verify submission baseline
        env:
          TARGET_COMMIT: ${{ inputs.target_commit || github.sha }}
        run: |
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --is-shallow-repository)" = false
          git merge-base --is-ancestor "$TARGET_COMMIT" origin/main
          git checkout --detach "$TARGET_COMMIT"
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          git log -1 --format='%H %s'
          git diff-tree --root --no-commit-id --name-only --no-renames -r HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare bundle notes
        run: |
          cat > bundle-notes.json <<'EOF'
          {
            "explanation": "5단계 브라우저 코드 점검에서 메모 CRUD의 Supabase 직접 호출이 없고 기존 서버 함수만 호출함을 확인했습니다. 공개 publishable 키로 원본 REST GET을 실제 실행해 HTTP 401·42501 권한 거부와 메모 미반환을 확인했습니다. 기존 소유권 모의 CRUD 테스트는 통과했으며 실제 A 로그인 CRUD 및 B 접근의 이번 독립 재검증은 수행하지 않았습니다. 인증된 사용자 JWT 원본 GET·수정 요청은 세션 부재로 미실행입니다. DB 권한·RLS 적용 상태는 사용자 보고와 독립 검증을 구분하며 이번 준비에서 DB 재검증과 번들 실행은 하지 않았습니다.",
            "blockedAt": "실제 A/B 로그인 동작, 인증된 사용자 원본 API 접근·수정 및 DB 권한의 독립 재검증"
          }
          EOF

      - name: Generate submission bundle
        run: npm run bundle

      - name: Verify submission commit and changedFiles
        env:
          TARGET_COMMIT: ${{ inputs.target_commit || github.sha }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const bundle = JSON.parse(readFileSync('artifacts/submission.json', 'utf8'));
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(bundle.commit, process.env.TARGET_COMMIT);
          assert.equal(bundle.commit, git('rev-parse', 'HEAD'));
          const files = git('diff-tree', '--root', '--no-commit-id', '--name-only', '--no-renames', '-r', 'HEAD').split(/\r?\n/).filter(Boolean).sort();
          assert.deepEqual(bundle.changedFiles, files);
          assert.equal(bundle.step, 5);
          console.log('Verified submission baseline:', bundle.commit, 'changedFiles:', files.length);
          JS

      - name: Print submission JSON
        run: cat artifacts/submission.json

      - name: Upload submission JSON
        uses: actions/upload-artifact@v4
        with:
          name: aleph-step5-submission
          path: artifacts/submission.json
          if-no-files-found: error
