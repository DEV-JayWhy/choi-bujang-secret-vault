name: ALEPH Defense Bundle

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Submission baseline: optional full SHA; blank uses workflow commit (changedFiles is this commit only)'
        required: false
        default: ''
        type: string
      check_app_url:
        description: 'HTTP check URL: Preview root HTTPS URL required on stage5-server-auth; blank on main uses production config'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select and verify submission baseline
        env:
          TARGET_COMMIT: ${{ inputs.target_commit || github.sha }}
          BASELINE_BRANCH: ${{ github.ref_name }}
          CHECK_APP_URL: ${{ inputs.check_app_url }}
        run: |
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse --is-shallow-repository)" = false
          git merge-base --is-ancestor "$TARGET_COMMIT" "origin/$BASELINE_BRANCH"
          if [ "$BASELINE_BRANCH" = stage5-server-auth ]; then test -n "$CHECK_APP_URL"; fi
          git checkout --detach "$TARGET_COMMIT"
          test "$(git rev-parse HEAD)" = "$TARGET_COMMIT"
          git log -1 --format='%H %s'
          git diff-tree --root --no-commit-id --name-only --no-renames -r HEAD

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare bundle notes
        run: |
          cat > bundle-notes.json <<'EOF'
          {
            "explanation": "사용자 실제 Preview 검증(fa8ff72, 1a4w0gmgm 배포): A 기존 메모 4건 조회, 로그인·F5 세션 유지·로그아웃 후 F5 메모 미표시·계정별 분리, auth-ui.js와 notes API nosniff 확인. A에서 B 메모 직접 GET·PUT·DELETE 모두 404, B 재로그인 후 원본 제목·본문 보존 확인. 이전 3576932 Preview에서는 시험 메모 CRUD 및 auth-config.js/data.json 404를 확인했습니다. 사용자 결과와 모의 SDK/DB 회귀 테스트는 구분합니다. 기존 독립 읽기 전용 DB 조회는 RLS 활성화·소유자 정책 4개·PUBLIC 테이블 권한 없음·anon/authenticated 테이블 7종 및 직접 열 권한 없음·service_role 7종 true 확인이며 이번 DB 재검증은 아닙니다. 실제 교차 출처 요청과 만료 세션 처리는 미검증입니다. test:package는 기준 main에도 있는 최상위 api/notes.js 목록 불일치로 실패하며 bundle 선행 검사는 아닙니다. HTTP 자기 점검 대상은 별도 표시하고 Preview 결과를 Production 검증으로 표현하지 않습니다.",
            "blockedAt": "실제 교차 출처 403/쿠키 미변경·만료 세션 갱신/회수·인증 API 전체/메모 상세 및 오류 응답 헤더·새 Preview 정적 파일 전체 키 검색·로그 비밀값·인증 사용자 원본 REST 직접 차단 미검증; 심판 패키징 규칙 수용 여부 미확인"
          }
          EOF

      - name: Generate submission bundle
        env:
          ALEPH_CHECK_APP_URL: ${{ inputs.check_app_url }}
        run: npm run bundle

      - name: Verify submission commit and changedFiles
        env:
          TARGET_COMMIT: ${{ inputs.target_commit || github.sha }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const bundle = JSON.parse(readFileSync('artifacts/submission.json', 'utf8'));
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(bundle.commit, process.env.TARGET_COMMIT);
          assert.equal(bundle.commit, git('rev-parse', 'HEAD'));
          const files = git('diff-tree', '--root', '--no-commit-id', '--name-only', '--no-renames', '-r', 'HEAD').split(/\r?\n/).filter(Boolean).sort();
          assert.deepEqual(bundle.changedFiles, files);
          assert.equal(bundle.step, 5);
          console.log('Verified submission baseline:', bundle.commit, 'changedFiles:', files.length);
          JS

      - name: Print submission JSON
        run: cat artifacts/submission.json

      - name: Upload submission JSON
        uses: actions/upload-artifact@v4
        with:
          name: aleph-step5-submission
          path: artifacts/submission.json
          if-no-files-found: error
