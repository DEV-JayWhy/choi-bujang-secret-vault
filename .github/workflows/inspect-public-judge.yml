name: Inspect Public Judge Frontend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-public-judge.yml']
jobs:
  public-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Examine publicly served HTML and JavaScript for Stage 10 contracts
        run: |
          node --input-type=module <<'NODE'
          const origin='https://aleph-omega.vercel.app';
          const response=await fetch(origin+'/defense',{redirect:'follow',signal:AbortSignal.timeout(12000)});
          const html=await response.text();
          console.log('PAGE',JSON.stringify({status:response.status,url:response.url,length:html.length}));
          if(response.status!==200)process.exit(1);
          const paths=[...new Set([...html.matchAll(/(?:src|href)="([^"]+\.js(?:\?[^"]*)?)"/g)].map(x=>x[1]))].slice(0,35);
          console.log('PUBLIC_JS_ASSETS',paths.length, JSON.stringify(paths));
          for(const term of ['3차 침공','닭크웹','방어','침공','defense','attack','href=','/cortex','login','portal-state','서버']){
            const idx=html.toLowerCase().indexOf(term.toLowerCase());
            console.log('HTML_REFERENCE',JSON.stringify({term,found:idx>=0,
              excerpt:idx<0?'':html.slice(Math.max(0,idx-90),idx+190).replace(/[\r\n]/g,' ')}));
          }
          console.log('SCRIPT_TAGS',JSON.stringify([...html.matchAll(/<script[^>]*>/g)].map(x=>x[0]).slice(0,25)));
          console.log('JS_LINKS',JSON.stringify([...new Set([...html.matchAll(/(?:src|href)=["']([^"']+\.js[^"']*)["']/g)].map(x=>x[1]))].slice(0,70)));

          const patterns=[/S10_BACKUP_UNVERIFIED/g,/S10_RESTORE_MISMATCH/g,/S10_RETEST_MISSING/g,/backupVersion/g,/restoreRoute/g,/judgeIssuer/g,/\/api\/restore/g,/changedFields/g,/postRestoreRetest/g];
          const visited=new Set(); const queue=paths.map(p=>new URL(p,origin+'/defense').href);
          while(queue.length && visited.size<65){
            const path=queue.shift();if(visited.has(path))continue;visited.add(path);
            try{
              const r=await fetch(new URL(path,origin),{signal:AbortSignal.timeout(10000)});
              if(!r.ok)continue;
              const source=await r.text();
              const imports=[...source.matchAll(/from\\s*['"]([^'"]+\\.js)['"]/g)].map(x=>x[1]);
              for(const p of imports)if(p.startsWith('.'))queue.push(new URL(p,path).href);
              const words=['S10_BACKUP_UNVERIFIED','S10_RESTORE_MISMATCH','S10_RETEST_MISSING','restoreRoute','stage10','attackAttempts','backupVersion','judge'];
              const found=words.filter(x=>source.includes(x));
              if(found.length)console.log('MODULE_MATCH',JSON.stringify({path,found,imports}));
              if(path.includes('defense-launch'))console.log('ENTRY_SOURCE',source.slice(0,9500));
              const hits=[];
              for(const re of patterns)if(re.test(source))hits.push(re.source);
              if(hits.length){
                console.log('ASSET_MATCH',JSON.stringify({path,length:source.length,hits}));
                for(const re of patterns){
                  re.lastIndex=0;const match=re.exec(source);
                  if(match)console.log('PUBLIC_CONTEXT',JSON.stringify({path,term:re.source,excerpt:source.slice(Math.max(0,match.index-120),match.index+180).replace(/[\\r\\n]/g,' ')}));
                }
              }
            }catch(e){console.log('ASSET_UNAVAILABLE',path,String(e).slice(0,100))}
          }
          NODE
