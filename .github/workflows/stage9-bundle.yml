name: Stage 10 Submission Bundle

on:
  push:
    branches: [main]
    paths:
      - 'src/detect.mjs'
      - 'src/recovery-handler.mjs'
      - 'api/restore.js'
      - 'api/restore/policy.js'
      - 'sql/10_verified_recovery.sql'
      - 'test/recovery-api.test.mjs'
      - 'src/attack-check.mjs'
      - 'scripts/bundle.mjs'
      - 'aleph.config.json'
      - 'README.md'
      - '.github/workflows/stage9-bundle.yml'
      - '.github/workflows/stage8-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-stage10-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete public history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Stage 1-10 practice contracts and previous decisions
        run: |
          npm run detect:test
          node --test test/detect-input.test.mjs test/detect-window.test.mjs test/attack-check-readonly.test.mjs test/recovery-api.test.mjs test/post-restore-retest.test.mjs
          npm run decider:test
          npm run fixture:7
          npm run build -- --local
      - name: Prepare ignored submission notes
        run: |
          cat > bundle-notes.json <<'EOF'
          {
            "explanation": "10단계: 운영 Supabase에 비공개 메모 사본과 현재 RLS 안전 정책 4개를 별도로 보관하고 내용·정책 해시를 검증했습니다. POST /api/restore는 서명 검증된 사용자 신원과 ID·소유자·내용 해시가 맞는 한 건만 트랜잭션으로 복원하며 감사 기록을 보존합니다. GET /api/restore/policy는 검증된 안전 정책 사본과 시험 정책 차이만 보여 주고, 확인 후 POST는 시험 정책만 원상복원합니다. 1~9단계 API, 판정기, 탐지기 회귀 테스트를 실행하고 실제 운영 자료는 시험 중 변경하지 않았습니다.",
            "blockedAt": "백업은 기존에 없었으므로 이번 10단계 시작 시점에 생성한 검증된 기준본이며 과거 사고 이전 백업이라고 주장하지 않습니다. 실제 서명된 시험 계정 B에서 일으키는 변조·삭제·복구 및 심판의 1~9단계 전체 재전송은 아직 미실행입니다. DB 복구 기능은 트랜잭션 안의 합성 B 사건으로 변조·삭제·정책 복원을 확인한 뒤 롤백했습니다. 심판 점수는 미확인입니다."
          }
          EOF
      - name: Generate submission JSON with npm run bundle
        run: npm run bundle
      - name: Verify bundle contract and safe self-check
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const data = JSON.parse(readFileSync('artifacts/submission.json', 'utf8'));
          const actualSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const changed = execFileSync('git', [
            'diff-tree', '--root', '--no-commit-id', '--name-only', '--no-renames',
            '-r', 'HEAD',
          ], { encoding: 'utf8' }).trim().split(/\r?\n/u).filter(Boolean).sort();
          assert.equal(data.schema, 'aleph.defense.submission.v2');
          assert.equal(data.step, 10);
          assert.equal(data.commit, actualSha);
          assert.equal(data.commit, process.env.EXPECTED_SHA);
          assert.deepEqual(data.changedFiles, changed);
          assert.ok(data.policyRules.includes('device_registered'));
          assert.ok(data.policyRules.includes('step_up_required'));
          assert.ok(data.policyRules.includes('resource_zone'));
          assert.equal(data.attackAttempts.length, 20);
          assert.equal(data.restoreRoute, '/api/restore/:id');
          assert.match(data.attackAttempts.find(x => x.attackId === 'restore_route_requires_login').observed, /HTTP 401; 메모 자료 감지되지 않음; 기대 조건 일치/u);
          for (const id of ['stage10_backup_revalidation', 'stage10_restoration_full_replay']) {
            assert.match(data.attackAttempts.find(x => x.attackId === id).observed, /^미실행/u);
          }
          assert.match(data.attackAttempts.find(x => x.attackId === 'stage9_normal_detection').observed, /120건 결과 observe; 기대 조건 일치/u);
          assert.match(data.attackAttempts.find(x => x.attackId === 'stage9_burst_detection').observed, /121건 결과 propose_revocation; 이유 burst_read; 기대 조건 일치/u);
          for (const id of ['stage9_revoked_identity_retry', 'stage9_stolen_session_retry', 'stage9_cross_resource_retry']) {
            assert.match(data.attackAttempts.find(x => x.attackId === id).observed, /^미실행/u);
          }
          console.log('STAGE10_BUNDLE_VERIFIED', JSON.stringify({
            step: data.step, commit: data.commit, changedFiles: data.changedFiles,
            ruleIds: data.policyRules, attackCount: data.attackAttempts.length,
            normal: data.attackAttempts.find(x => x.attackId === 'stage9_normal_detection').observed,
            burst: data.attackAttempts.find(x => x.attackId === 'stage9_burst_detection').observed,
            observedHTTP: data.attackAttempts.filter(x => x.observed.includes('HTTP ')).map(x => ({
              id: x.attackId, observed: x.observed,
            })),
          }));
          JS
      - name: Print generated submission JSON
        run: cat artifacts/submission.json
      - name: Upload stage 10 submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: aleph-stage10-submission
          path: artifacts/submission.json
          if-no-files-found: error
