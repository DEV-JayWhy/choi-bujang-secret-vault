<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 내 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인 확인</div>
    <h1>내 자료실</h1>
    <p>공개 파일에서 메모를 제거했습니다.</p>
    <div class="notice">로그인 후 메모를 볼 수 있습니다. 서버가 로그인 토큰을 확인합니다.</div>
    <section aria-label="계정 로그인" style="margin:24px 0;padding:20px;border:1px solid #51667c;border-radius:14px">
      <p id="auth-status" role="status" aria-live="polite">로그인 상태 확인 중…</p>
      <form id="login-form">
        <label for="email">이메일</label>
        <input id="email" type="email" autocomplete="username" required style="display:block;margin:8px 0 16px;padding:10px;max-width:100%;box-sizing:border-box">
        <label for="password">비밀번호</label>
        <input id="password" type="password" autocomplete="current-password" required style="display:block;margin:8px 0 16px;padding:10px;max-width:100%;box-sizing:border-box">
        <button id="login-button" type="submit" disabled>로그인</button>
      </form>
      <button id="logout-button" type="button" hidden>로그아웃</button>
      <p id="auth-message" role="alert" aria-live="polite"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>로그인하면 메모를 표시합니다.</li></ul>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script type="module" src="/auth-ui.js"></script>

</body>
</html>
